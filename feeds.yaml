# feeds.yaml — maps each source name used in interests.yaml to where it is fetched from.
#   url:    an RSS/Atom feed
#   google: a Google News search (for sites with no feed of their own)
# To add a source: add an entry here, then use its name in interests.yaml.

# --- Football ---
chelseafc.com news:     { google: "site:chelseafc.com" }
BBC Sport Chelsea:      { url: "https://feeds.bbci.co.uk/sport/football/teams/chelsea/rss.xml" }
Chelsea FC (Google News): { google: '"Chelsea FC"' }
premierleague.com:      { google: "site:premierleague.com" }
BBC Sport football:     { url: "https://feeds.bbci.co.uk/sport/football/premier-league/rss.xml" }

# --- Thailand (English) ---
